name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: compile angular
        run: |
          npx ng build --configuration production --base-href /famicare-app-frontend/

      - name: setup spa support
        run: |
          if [ -d "dist/famicare-app-frontend/browser" ]; then
            cp dist/famicare-app-frontend/browser/index.html dist/famicare-app-frontend/browser/404.html
            echo "OUTPUT_DIR=dist/famicare-app-frontend/browser" >> $GITHUB_ENV
          else
            cp dist/famicare-app-frontend/index.html dist/famicare-app-frontend/404.html
            echo "OUTPUT_DIR=dist/famicare-app-frontend" >> $GITHUB_ENV
          fi

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
